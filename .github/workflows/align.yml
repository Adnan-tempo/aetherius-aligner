# Times one recording's transcript, word by word, when Supabase asks.
#
# Triggered by the `align-transcript` Supabase function with a
# repository_dispatch (event type "align-transcript", payload {table, id}).
# Free forced alignment on GitHub's runner -- no speech API, no server.
#
# Repository secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
name: Align transcript

on:
  repository_dispatch:
    types: [align-transcript]
  workflow_dispatch:
    inputs:
      table:
        description: journey_days or teaching_episodes
        required: true
        default: teaching_episodes
      id:
        description: Row id
        required: true

concurrency:
  # One job per recording; a second save while one is running replaces it.
  group: align-${{ github.event.client_payload.id || inputs.id }}
  cancel-in-progress: true

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      TABLE: ${{ github.event.client_payload.table || inputs.table }}
      ROW_ID: ${{ github.event.client_payload.id || inputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the aligner (CPU torch)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache the Whisper model
        uses: actions/cache@v4
        with:
          path: .cache/whisper
          key: whisper-base-v1

      - name: Align and save
        run: python run_once.py "$TABLE" "$ROW_ID"
